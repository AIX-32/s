<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill Timer</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-transform: uppercase;
        }
        #timer {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        button {
            background: white;
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="timer">00:00</div>
    <button id="startBtn">Start Drill</button>

    <script>
        let seconds = 0;
        let timerInterval;
        let beepTimeout;
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep() {
            const gainNode = audioCtx.createGain();
            
            // Oscillator 1 (Main tone)
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'square';
            osc1.frequency.setValueAtTime(880, audioCtx.currentTime);
            
            // Oscillator 2 (High pitch layer for "piercing" effect)
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.setValueAtTime(1760, audioCtx.currentTime);

            // Increased gain for maximum volume (1.0 is full scale)
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.8);
            osc2.stop(audioCtx.currentTime + 0.8);
        }

        function scheduleNextBeep() {
            const nextBeepIn = Math.floor(Math.random() * 8000) + 12000;
            
            beepTimeout = setTimeout(() => {
                playBeep();
                scheduleNextBeep();
            }, nextBeepIn);
        }

        function startTimer() {
            if (timerInterval) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            startBtn.style.display = 'none';

            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);

            scheduleNextBeep();
        }

        startBtn.addEventListener('click', startTimer);
    </script>
</body>
</html>
